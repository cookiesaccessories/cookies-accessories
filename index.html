<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cookies Accessories</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#141414;--mute:#6b6b6b;--gold:#e8a935;--soft:#faf5ea;--line:#eee3cc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141210;--ink:#f6efe0;--mute:#b0a690;--soft:#1e1b17;--line:#332e25;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141210;--ink:#f6efe0;--mute:#b0a690;--soft:#1e1b17;--line:#332e25;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,Cairo,system-ui,sans-serif;line-height:1.7;overflow-x:hidden}
html[lang="ar"] body{font-family:Cairo,Poppins,system-ui,sans-serif}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
#pg{position:fixed;top:0;left:0;width:100%;height:3px;background:linear-gradient(90deg,#9a6b12,#fff1b8,#e8a935);transform:scaleX(0);transform-origin:left;z-index:50}
.bar{background:#0e0c09;color:#f6e3b4;text-align:center;font-size:.85rem;padding:.5rem 1rem}
header{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.7rem 5vw;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
header img{height:46px;width:46px;border-radius:50%;object-fit:cover;transition:transform .8s}
.brand:hover img{transform:rotate(360deg)}
.brand{display:flex;align-items:center;gap:.7rem;font-weight:600;letter-spacing:.12em;font-size:.95rem;direction:ltr}
nav{display:flex;gap:1.5rem;font-size:.95rem}
nav a{position:relative}
nav a::after{content:"";position:absolute;inset-inline:0;bottom:-2px;height:2px;background:var(--gold);transform:scaleX(0);transition:transform .25s}
nav a:hover::after{transform:scaleX(1)}
.tools{display:flex;gap:.5rem;align-items:center}
.pill{border:1.5px solid var(--ink);background:none;color:var(--ink);border-radius:99px;padding:.3rem .9rem;font-size:.9rem;transition:all .2s}
.pill:hover{background:var(--ink);color:var(--bg)}
.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.25) rotate(-4deg);background:var(--gold);color:#141414}}
.dd{position:relative}
.menu{position:absolute;inset-inline-end:0;top:calc(100% + 8px);min-width:150px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:.35rem;box-shadow:0 12px 30px #0003;transform-origin:top;transform:scale(.8) translateY(-8px);opacity:0;pointer-events:none;transition:all .2s}
.dd.open .menu{transform:none;opacity:1;pointer-events:auto}
.menu button{display:flex;justify-content:space-between;width:100%;border:0;background:none;color:var(--ink);padding:.5rem .8rem;border-radius:9px}
.menu button:hover{background:var(--soft)}
.menu button[aria-current="true"]{color:var(--gold);font-weight:600}

.hero{position:relative;overflow:hidden;text-align:center;padding:4.5rem 5vw 5rem;background:radial-gradient(circle at 50% 30%,#2e2312,#0e0c09 70%);color:#f6efe0;perspective:800px}
#cv{position:absolute;inset:0;width:100%;height:100%}
.hero>*:not(#cv){position:relative}
.logo{display:inline-block;position:relative;animation:pop 1.1s cubic-bezier(.2,1.4,.4,1) both}
.logo img{width:min(270px,58vw);border-radius:50%;display:block;box-shadow:0 0 60px #e8a93577;transition:transform .15s}
.logo::before,.logo::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--gold);animation:ring 2.8s ease-out infinite}
.logo::after{animation-delay:1.4s}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(1.4);opacity:0}}
@keyframes pop{from{transform:scale(.2) rotate(-30deg);opacity:0}}
h1{font-size:clamp(1.7rem,6vw,3.3rem);letter-spacing:.08em;margin:1.6rem 0 .3rem;line-height:1.15;direction:ltr}
h1 span{display:inline-block;color:transparent;background:linear-gradient(100deg,#b8821a,#fff6cf,#e8a935,#b8821a) 0 0/300% 100%;-webkit-background-clip:text;background-clip:text;animation:up .7s cubic-bezier(.2,.9,.3,1.2) both,sheen 3s linear infinite;animation-delay:calc(.5s + var(--d)*.05s),calc(var(--d)*.1s)}
@keyframes up{from{transform:translateY(70%) rotate(8deg);opacity:0}}
@keyframes sheen{to{background-position:-300% 0}}
.sub{font-size:1.15rem;color:#f6e3b4;margin:.4rem 0 .2rem;animation:fade 1s 1.5s both}
.hero p{color:#c9bda3;max-width:34rem;margin:.5rem auto 1.7rem;animation:fade 1s 1.7s both}
.hero .btn{animation:fade 1s 1.9s both}
@keyframes fade{from{opacity:0;transform:translateY(14px)}}
.btn{display:inline-block;background:var(--gold);color:#141414;border:0;border-radius:99px;padding:.8rem 2rem;font-weight:600;position:relative;overflow:hidden}
.btn::after,.mat::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,#fff9,transparent);animation:shine 3s 2.5s infinite}
@keyframes shine{to{left:130%}}
.star{position:absolute!important;color:var(--gold);pointer-events:none;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{transform:scale(.4) rotate(60deg);opacity:.2}}

.marq{overflow:hidden;background:linear-gradient(90deg,#9a6b12,#e8a935,#9a6b12);color:#141414;padding:.7rem 0;direction:ltr;white-space:nowrap;font-weight:600}
.marq div{display:inline-block;animation:roll 30s linear infinite}
.marq span{margin:0 1.4rem}
.marq span::after{content:"✦";margin-inline-start:2.8rem}
@keyframes roll{to{transform:translateX(-50%)}}

section{padding:3.5rem 5vw}
h2{font-size:1.8rem;letter-spacing:.04em;margin:0 0 1.5rem;text-align:center}
.mats{display:grid;grid-template-columns:1fr 1fr;gap:1rem;max-width:1150px;margin:0 auto 1.8rem}
.mat{border:0;border-radius:18px;padding:1.6rem 1rem;color:#141414;position:relative;overflow:hidden;font-weight:700;font-size:1.25rem;transition:transform .3s,box-shadow .3s}
.mat small{display:block;font-weight:400;font-size:.85rem}
.mat.gold{background:linear-gradient(135deg,#fff1b8,#e8a935 55%,#b8821a)}
.mat.steel{background:linear-gradient(135deg,#fff,#c3cbd3 55%,#7d8790)}
.mat:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 14px 28px #0003}
.mat[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:3px}
.cats{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin-bottom:2rem}
.cats button{border:1.5px solid var(--line);background:none;color:var(--ink);border-radius:99px;padding:.4rem 1.2rem;transition:all .2s}
.cats button:hover{border-color:var(--gold)}
.cats button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1.4rem;max-width:1150px;margin:auto}
.card{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--bg);opacity:0;transform:translateY(50px) scale(.92) rotate(2deg);transition:opacity .7s,transform .7s cubic-bezier(.2,.9,.3,1.2),box-shadow .3s;transition-delay:calc(var(--i)*80ms)}
.card.in{opacity:1;transform:none}
.card.in:hover{transform:perspective(700px) rotateX(var(--ry,0deg)) rotateY(var(--rx,0deg)) translateY(-8px);box-shadow:0 18px 36px #e8a93555;transition:transform .12s,box-shadow .3s;transition-delay:0s}
.pic{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#3a2d17,#14110c 75%);overflow:hidden}
.pic::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),#ffffff40,transparent 50%);opacity:0;transition:opacity .3s}
.card:hover .pic::after{opacity:1}
.ic{width:62%;animation:flo 4s ease-in-out infinite;filter:drop-shadow(0 0 8px #e8a93566)}
@keyframes flo{50%{transform:translateY(-8px) rotate(3deg)}}
.card:hover .ic{animation-duration:1.4s}
.ph{width:100%;height:100%;object-fit:cover;animation:none;filter:none}
.sp{position:absolute;color:#fff1b8;animation:tw 2.4s ease-in-out infinite}
.badge{position:absolute;top:.6rem;inset-inline-start:.6rem;font-size:.72rem;font-weight:600;padding:.1rem .6rem;border-radius:99px;color:#141414;z-index:1}
.badge.gold{background:linear-gradient(135deg,#fff1b8,#e8a935)}
.badge.steel{background:linear-gradient(135deg,#fff,#b9c2cb)}
.info{padding:1rem}
.info h3{font-size:1rem;margin:0}
.info small{color:var(--mute)}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:.8rem;gap:.5rem}
.row b{font-weight:600}
.add{background:var(--ink);color:var(--bg);border:0;border-radius:99px;padding:.35rem 1rem;font-size:.85rem;transition:transform .15s,background .2s}
.add:hover{background:var(--gold);color:#141414}
.add:active{transform:scale(.9)}
.about{background:var(--soft);text-align:center}
.about p{max-width:36rem;margin:0 auto;color:var(--mute)}
.rv{opacity:0;transform:translateY(30px);transition:all .8s}
.rv.in{opacity:1;transform:none}
footer{text-align:center;padding:2.5rem 5vw;border-top:1px solid var(--line);color:var(--mute);font-size:.9rem}

.drawer{position:fixed;top:0;inset-inline-end:0;height:100%;width:min(380px,100%);background:var(--bg);border-inline-start:1px solid var(--line);z-index:40;padding:calc(1.2rem + env(safe-area-inset-top,0px)) 1.2rem calc(1.2rem + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;transform:translateX(105%);transition:transform .4s cubic-bezier(.2,.9,.3,1)}
[dir="rtl"] .drawer{transform:translateX(-105%)}
.drawer.open,[dir="rtl"] .drawer.open{transform:none}
.drawer h3{margin:0 0 1rem;display:flex;justify-content:space-between}
.drawer ul{list-style:none;margin:0;padding:0;flex:1;overflow:auto}
.drawer li{display:flex;justify-content:space-between;gap:.5rem;padding:.6rem 0;border-bottom:1px solid var(--line);font-size:.92rem;animation:fade .4s}
.drawer li button{border:0;background:none;color:var(--mute)}
.empty{color:var(--mute);padding:1rem 0}
.total{display:flex;justify-content:space-between;font-weight:600;margin:1rem 0}
.btn.msn{background:#0a7cff;color:#fff;text-align:center}
.fly{position:fixed;z-index:60;pointer-events:none;color:var(--gold)}
.toast{position:fixed;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,150%);background:var(--ink);color:var(--bg);padding:.7rem 1.2rem;border-radius:12px;z-index:70;transition:transform .4s;max-width:90vw;text-align:center}
.toast.on{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.card,.rv{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="pg"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="100"><stop offset="0" stop-color="#fff1b8"/><stop offset=".5" stop-color="#e8a935"/><stop offset="1" stop-color="#9a6b12"/></linearGradient>
<linearGradient id="steel" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="100"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#b9c2cb"/><stop offset="1" stop-color="#6a747d"/></linearGradient>
</defs></svg>
<div class="bar" data-t="bar"></div>
<header>
  <a class="brand" href="#top"><img src="logo.jpg" alt="Cookies Accessories logo">COOKIES</a>
  <nav><a href="#shop" data-t="nShop"></a><a href="#about" data-t="nAbout"></a><a href="#contact" data-t="nContact"></a></nav>
  <div class="tools">
    <div class="dd" id="dd">
      <button class="pill" id="ddb" aria-haspopup="true" aria-expanded="false"><span data-t="langLabel"></span> ▾</button>
      <div class="menu" id="menu"><button data-l="ar">العربية</button><button data-l="en">English</button></div>
    </div>
    <button class="pill" id="open"><span data-t="cart"></span> (<span id="count">0</span>)</button>
  </div>
</header>

<main id="top">
<div class="hero" id="hero">
  <canvas id="cv"></canvas>
  <div class="logo"><img id="lg" src="logo.jpg" alt="Cookies Accessories logo"></div>
  <h1 id="title" aria-label="Cookies Accessories"></h1>
  <div class="sub" data-t="sub"></div>
  <p data-t="heroP"></p>
  <a class="btn" href="#shop" data-t="heroBtn"></a>
</div>
<div class="marq" aria-hidden="true"><div id="marq"></div></div>

<section id="shop">
  <h2 class="rv" data-t="shop"></h2>
  <div class="mats">
    <button class="mat gold" data-m="gold" aria-pressed="false"><span data-t="gold"></span><small data-t="goldD"></small></button>
    <button class="mat steel" data-m="steel" aria-pressed="false"><span data-t="steel"></span><small data-t="steelD"></small></button>
  </div>
  <div class="cats" id="cats" role="group"></div>
  <div class="grid" id="grid"></div>
</section>

<section class="about" id="about">
  <h2 class="rv" data-t="aboutH"></h2>
  <p class="rv" data-t="aboutP"></p>
</section>
</main>

<footer id="contact">
  <p data-t="foot"></p>
  <p>© 2026 Cookies Accessories</p>
</footer>

<aside class="drawer" id="drawer" aria-label="Cart">
  <h3><span data-t="yourCart"></span> <button id="close" aria-label="Close" style="border:0;background:none;color:var(--ink);font-size:1.2rem">✕</button></h3>
  <ul id="items"></ul>
  <div class="total"><span data-t="total"></span><span id="total"></span></div>
  <a class="btn msn" id="msn" target="_blank" rel="noopener" data-t="order"></a>
</aside>
<div class="toast" id="toast" role="status"></div>

<script>
// Change this to your Facebook page username (the part after m.me/)
var PAGE="61575131623485";

var T={
en:{langLabel:"Language",bar:"Chinese gold & stainless steel ★ Order on Messenger",nShop:"Shop",nAbout:"About",nContact:"Contact",cart:"Cart",
sub:"Chinese gold & stainless steel accessories",heroP:"Rings, necklaces, earrings, bracelets and anklets with a shine that gets noticed.",heroBtn:"Shop the collection",
shop:"Shop",all:"All",add:"Add to cart",gold:"Chinese gold",goldD:"Bright gold look for every day",steel:"Stainless steel",steelD:"Strong, clean and made to last",
aboutH:"About Cookies",aboutP:"Cookies Accessories sells Chinese gold and stainless steel pieces. Pick your favorite, add it to the cart and send us the order on Messenger.",
foot:"Order and ask us anything on Messenger.",yourCart:"Your cart",total:"Total",order:"Order on Messenger",
empty:"Your cart is empty. Add something shiny.",remove:"Remove",cur:"EGP",
hi:"Hi Cookies Accessories, I want to order:",tot:"Total",copied:"Your order is copied. Paste it in the Messenger chat.",
Rings:"Rings",Necklaces:"Necklaces",Earrings:"Earrings",Bracelets:"Bracelets",Anklets:"Anklets",
mq:["Chinese gold","Stainless steel","Rings","Necklaces","Earrings","Bracelets","Anklets"]},
ar:{langLabel:"اللغة",bar:"دهب صيني واستانليس ★ اطلب على ماسنجر",nShop:"المتجر",nAbout:"من نحن",nContact:"تواصل معنا",cart:"السلة",
sub:"إكسسوارات دهب صيني واستانليس",heroP:"خواتم وسلاسل وحلقان وأساور وخلاخيل بلمعة تلفت الأنظار.",heroBtn:"شوف المنتجات",
shop:"المتجر",all:"الكل",add:"أضف للسلة",gold:"دهب صيني",goldD:"لمعة الدهب لكل يوم",steel:"استانليس",steelD:"قوي ونضيف ويعيش",
aboutH:"عن كوكيز",aboutP:"كوكيز أكسسوارز بتبيع دهب صيني واستانليس. اختار قطعتك، ضيفها للسلة وابعتلنا الطلب على ماسنجر.",
foot:"اطلب واسألنا عن أي حاجة على ماسنجر.",yourCart:"سلتك",total:"الإجمالي",order:"اطلب على ماسنجر",
empty:"السلة فاضية. ضيف حاجة لامعة.",remove:"حذف",cur:"جنيه",
hi:"أهلاً كوكيز أكسسوارز، عايز أطلب:",tot:"الإجمالي",copied:"تم نسخ طلبك. الصقه في محادثة ماسنجر.",
Rings:"خواتم",Necklaces:"سلاسل",Earrings:"حلقان",Bracelets:"أساور",Anklets:"خلاخيل",
mq:["دهب صيني","استانليس","خواتم","سلاسل","حلقان","أساور","خلاخيل"]}};
var P=[];
var types=["All","Rings","Necklaces","Earrings","Bracelets","Anklets"],ty="All",mat="",cart=[],L="ar";
try{L=localStorage.getItem("lang")||"ar"}catch(e){}
var $=id=>document.getElementById(id),t=k=>T[L][k],name=p=>p[0][L];
var RM=matchMedia("(prefers-reduced-motion:reduce)").matches;
var io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.15});

function icon(k,m){
  var s='stroke="url(#'+m+')" fill="none" stroke-width="5" stroke-linecap="round"',f='fill="url(#'+m+')"',b="";
  if(k=="Rings")b='<circle cx="50" cy="62" r="22" '+s+'/><polygon points="50,10 63,25 50,40 37,25" '+f+'/>';
  if(k=="Necklaces")b='<path d="M16 18Q50 96 84 18" '+s+' stroke-dasharray="7 4"/><circle cx="50" cy="66" r="8" '+f+'/>';
  if(k=="Earrings")b=[34,66].map(x=>'<circle cx="'+x+'" cy="20" r="4" '+f+'/><path d="M'+x+' 30q12 18 0 34q-12-16 0-34z" '+f+'/>').join("");
  if(k=="Bracelets")b='<circle cx="50" cy="52" r="30" '+s+' stroke-dasharray="9 4"/><circle cx="50" cy="22" r="6" '+f+'/>';
  if(k=="Anklets")b='<ellipse cx="50" cy="42" rx="36" ry="16" '+s+' stroke-dasharray="9 4"/><path d="M50 58v10" '+s+'/><circle cx="50" cy="75" r="7" '+f+'/>';
  return '<svg viewBox="0 0 100 100" class="ic" aria-hidden="true">'+b+'</svg>';
}
function showToast(m){var x=$("toast");x.textContent=m;x.classList.add("on");setTimeout(()=>x.classList.remove("on"),3500)}
function render(){
  $("cats").innerHTML=types.map(c=>'<button aria-pressed="'+(c==ty)+'" data-c="'+c+'">'+(c=="All"?t("all"):t(c))+'</button>').join("");
  document.querySelectorAll(".mat").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m==mat));
  var n=0;
  $("grid").innerHTML=P.map((p,i)=>(!mat||p[3]==mat)&&(ty=="All"||p[1]==ty)?
   '<div class="card" style="--i:'+(n++)+'"><div class="pic"><span class="badge '+p[3]+'">'+t(p[3])+'</span>'+(p[4]?'<img class="ic ph" src="'+p[4]+'" alt="">':icon(p[1],p[3]))+'<span class="sp" style="top:18%;left:20%">✦</span><span class="sp" style="bottom:20%;right:18%;animation-delay:1s">✦</span></div><div class="info"><h3>'+name(p)+'</h3><small>'+t(p[1])+'</small><div class="row"><b>'+p[2]+' '+t("cur")+'</b><button class="add" data-i="'+i+'">'+t("add")+'</button></div></div></div>':"").join("");
  document.querySelectorAll(".card").forEach(c=>io.observe(c));
}
function lang(){
  document.documentElement.lang=L;document.documentElement.dir=L=="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
  document.querySelectorAll("#menu button").forEach(b=>b.setAttribute("aria-current",b.dataset.l==L));
  var m=t("mq").map(x=>"<span>"+x+"</span>").join("");$("marq").innerHTML=m+m+m+m;
  render();draw();
}
function draw(){
  var s=cart.reduce((a,i)=>a+P[i][2],0);
  $("count").textContent=cart.length;$("total").textContent=s+" "+t("cur");
  $("items").innerHTML=cart.length?cart.map((i,n)=>'<li><span>'+name(P[i])+' – '+P[i][2]+' '+t("cur")+'</span><button data-r="'+n+'">'+t("remove")+'</button></li>').join(""):'<li class="empty">'+t("empty")+'</li>';
  $("msn").href="https://m.me/"+PAGE;
}
function orderText(){return t("hi")+"\n"+cart.map(i=>"- "+name(P[i])).join("\n")+"\n"+t("tot")+": "+cart.reduce((a,i)=>a+P[i][2],0)+" "+t("cur")}
function spark(x,y,n,d){
  if(RM)return;
  for(var k=0;k<n;k++){var s=document.createElement("div");s.className="fly";s.style.cssText="left:"+x+"px;top:"+y+"px;font-size:"+(10+Math.random()*10)+"px";s.textContent="✦";document.body.appendChild(s);
  var a=Math.random()*6.28,r=d*(.5+Math.random());
  s.animate([{transform:"translate(0,0) scale(1)",opacity:1},{transform:"translate("+Math.cos(a)*r+"px,"+Math.sin(a)*r+"px) scale(.2) rotate(200deg)",opacity:0}],{duration:800}).onfinish=()=>s.remove()}
}
function fly(from){
  var r=from.getBoundingClientRect(),c=$("open").getBoundingClientRect(),d=document.createElement("div");
  d.className="fly";d.textContent="★";d.style.cssText="left:"+r.left+"px;top:"+r.top+"px;font-size:26px";document.body.appendChild(d);
