<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cookies Accessories</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'">
<link rel="icon" href="logo.jpg">
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Cormorant+Garamond:wght@500;600&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fffafc;--ink:#2b1622;--mute:#8d6c7d;--line:#f8d9e5;--soft:#fdeef4;--gold:#e2457f;--tg:#fde4ee;--ts:#f0eef7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1218;--ink:#fdeef4;--mute:#c9a5b6;--line:#3b2431;--soft:#281a22;--tg:#3a2230;--ts:#272a35;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1218;--ink:#fdeef4;--mute:#c9a5b6;--line:#3b2431;--soft:#281a22;--tg:#3a2230;--ts:#272a35;color-scheme:dark}
html{scroll-padding-top:calc(70px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,Cairo,system-ui,sans-serif;line-height:1.7;overflow-x:hidden}
html[lang="ar"] body{font-family:Cairo,Poppins,system-ui,sans-serif}
.disp{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;letter-spacing:.01em}
html[lang="ar"] .disp{font-family:Cairo,sans-serif;font-weight:700;letter-spacing:0}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.bar{background:var(--gold);color:#fff;text-align:center;font-size:.82rem;padding:.4rem 1rem}
header{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.7rem 5vw;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:.7rem;direction:ltr;font-family:"Cormorant Garamond",serif;font-weight:600;font-size:1.25rem;letter-spacing:.14em}
.brand img{width:40px;height:40px;border-radius:50%;object-fit:cover}
nav{display:flex;gap:2rem;font-size:.92rem}
nav a{color:var(--mute);transition:color .2s}
nav a:hover{color:var(--ink)}
.tools{display:flex;gap:.5rem;align-items:center}
.pill{border:1px solid var(--line);background:none;color:var(--ink);border-radius:99px;padding:.3rem .95rem;font-size:.88rem;transition:all .2s}
.pill:hover{border-color:var(--ink)}
.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.18);border-color:var(--gold)}}
.dd{position:relative}
.menu{position:absolute;inset-inline-end:0;top:calc(100% + 8px);min-width:150px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:.3rem;box-shadow:0 14px 34px #0002;transform-origin:top;transform:scale(.9) translateY(-6px);opacity:0;pointer-events:none;transition:all .18s}
.dd.open .menu{transform:none;opacity:1;pointer-events:auto}
.menu button{display:flex;justify-content:space-between;width:100%;border:0;background:none;color:var(--ink);padding:.5rem .8rem;border-radius:9px}
.menu button:hover{background:var(--soft)}
.menu button[aria-current="true"]{font-weight:600}
.menu button[aria-current="true"]::after{content:"✓";color:var(--gold)}

.hero{display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:3rem;max-width:1180px;margin:0 auto;padding:4.5rem 5vw 3.5rem}
.hl h1{font-size:clamp(2.3rem,5.4vw,4.1rem);line-height:1.12;margin:0 0 1.2rem}
.hl h1 span{display:inline-block;animation:up .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.15s + var(--d)*.09s)}
@keyframes up{from{opacity:0;transform:translateY(40%)}}
.lead{color:var(--mute);max-width:30rem;font-size:1.02rem;margin:0 0 2rem;animation:fade .9s .7s both}
.ctas{display:flex;gap:.8rem;flex-wrap:wrap;animation:fade .9s .9s both}
@keyframes fade{from{opacity:0;transform:translateY(14px)}}
.btn{display:inline-block;background:var(--gold);color:#fff;border:1px solid var(--gold);border-radius:99px;padding:.8rem 1.9rem;font-weight:500;transition:all .25s}
.btn:hover{background:#c92f6b;border-color:#c92f6b;color:#fff;transform:translateY(-2px)}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:none;color:var(--ink);border-color:var(--gold)}
.orb{position:relative;width:min(380px,80vw);aspect-ratio:1;margin:auto;animation:pop 1.1s cubic-bezier(.2,1,.3,1) both}
@keyframes pop{from{opacity:0;transform:scale(.85) rotate(-6deg)}}
.orb::before{content:"";position:absolute;inset:6%;border-radius:50%;background:var(--soft)}
.orb img{position:absolute;inset:15%;width:70%;height:70%;border-radius:50%;object-fit:cover;box-shadow:0 20px 50px #0002;animation:flo 6s ease-in-out infinite}
@keyframes flo{50%{transform:translateY(-8px)}}
.spin{position:absolute;inset:0;width:100%;height:100%;animation:rot 40s linear infinite}
.spin,.spin text{direction:ltr}
.spin text{font-size:12.5px;fill:var(--mute);letter-spacing:.1em;font-family:Poppins,sans-serif}
@keyframes rot{to{transform:rotate(360deg)}}
.tw{position:absolute;color:var(--gold);font-size:1.1rem;animation:tw 3.2s ease-in-out infinite}
@keyframes tw{50%{transform:scale(.4);opacity:.3}}

section{padding:4rem 5vw}
.in-w{max-width:1180px;margin:0 auto}
h2{font-size:clamp(1.8rem,3.5vw,2.5rem);margin:0 0 2rem;text-align:center;line-height:1.2}
.mats{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;max-width:1180px;margin:0 auto 2.5rem}
.mat{border:1px solid transparent;border-radius:22px;padding:1.8rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;color:var(--ink);text-align:start;transition:transform .35s,border-color .25s,box-shadow .35s;overflow:hidden}
.mat.gold{background:var(--tg)}.mat.steel{background:var(--ts)}
.mat b{display:block;font-size:1.35rem}
.mat span{color:var(--mute);font-size:.9rem}
.mat .ic{width:84px;flex:none;transition:transform .6s}
.mat:hover{transform:translateY(-4px);box-shadow:0 16px 34px #0001}
.mat:hover .ic{transform:rotate(12deg) scale(1.08)}
.mat[aria-pressed="true"]{border-color:var(--ink)}
.cats{display:flex;gap:1.6rem;justify-content:center;flex-wrap:wrap;margin-bottom:2.2rem}
.cats button{border:0;background:none;color:var(--mute);padding:.3rem 0;position:relative;transition:color .2s}
.cats button::after{content:"";position:absolute;inset-inline:0;bottom:-2px;height:1.5px;background:var(--gold);transform:scaleX(0);transition:transform .3s}
.cats button:hover,.cats button[aria-pressed="true"]{color:var(--ink)}
.cats button[aria-pressed="true"]::after{transform:scaleX(1)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1.6rem;max-width:1180px;margin:auto}
.card{opacity:0;transform:translateY(36px);transition:opacity .7s,transform .7s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--i)*70ms)}
.card.in{opacity:1;transform:none}
.pic{position:relative;aspect-ratio:1;border-radius:20px;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:transform .4s,box-shadow .4s}
.pic.gold{background:var(--tg)}.pic.steel{background:var(--ts)}
.card.in:hover .pic{transform:translateY(-6px);box-shadow:0 18px 36px #0002;transition-delay:0s}
.ic{width:56%;transition:transform .5s}
.card:hover .pic .ic{transform:rotate(-8deg) scale(1.06)}
.ph{width:100%;height:100%;object-fit:cover}
.bd{position:absolute;top:.8rem;inset-inline-start:.8rem;font-size:.72rem;padding:.05rem .7rem;border-radius:99px;background:var(--bg);color:var(--mute)}
.inf{padding:.9rem .3rem 0}
.inf h3{font-size:1rem;font-weight:600;margin:0}
.inf small{color:var(--mute)}
.pr{display:flex;justify-content:space-between;align-items:center;margin-top:.6rem;gap:.5rem}
.pr b{font-weight:500}
.add{background:none;border:1px solid var(--gold);color:var(--gold);border-radius:99px;padding:.25rem .95rem;font-size:.82rem;transition:all .2s}
.add:hover{background:var(--gold);color:#fff}
.add:active{transform:scale(.92)}
.none{grid-column:1/-1;text-align:center;color:var(--mute)}
.about{background:var(--soft);text-align:center}
.about p{max-width:36rem;margin:0 auto;color:var(--mute)}
.rv{opacity:0;transform:translateY(26px);transition:all .8s}
.rv.in{opacity:1;transform:none}
footer{text-align:center;padding:3rem 5vw 3.5rem;color:var(--mute);font-size:.9rem}
footer .btn{margin:.4rem 0 1.2rem}

.drawer{position:fixed;top:0;inset-inline-end:0;height:100%;width:min(380px,100%);background:var(--bg);border-inline-start:1px solid var(--line);z-index:40;padding:calc(1.2rem + env(safe-area-inset-top,0px)) 1.3rem calc(1.2rem + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;transform:translateX(105%);transition:transform .4s cubic-bezier(.2,.9,.3,1)}
[dir="rtl"] .drawer{transform:translateX(-105%)}
.drawer.open,[dir="rtl"] .drawer.open{transform:none}
.drawer h3{margin:0 0 1rem;display:flex;justify-content:space-between}
.drawer ul{list-style:none;margin:0;padding:0;flex:1;overflow:auto}
.drawer li{display:flex;justify-content:space-between;gap:.5rem;padding:.7rem 0;border-bottom:1px solid var(--line);font-size:.92rem;animation:fade .4s}
.drawer li button{border:0;background:none;color:var(--mute)}
.empty{color:var(--mute);padding:1rem 0}
.total{display:flex;justify-content:space-between;font-weight:600;margin:1rem 0}
.btn.msn{background:#0a7cff;border-color:#0a7cff;color:#fff;text-align:center}
.btn.msn:hover{background:#0066d9;border-color:#0066d9}
.fly{position:fixed;z-index:60;pointer-events:none;color:var(--gold)}
.toast{opacity:0;pointer-events:none;position:fixed;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,150%);background:var(--ink);color:var(--bg);padding:.7rem 1.2rem;border-radius:12px;z-index:70;transition:transform .4s;max-width:90vw;text-align:center}
.toast.on{transform:translate(-50%,0);opacity:1}
.srch{max-width:520px;margin:0 auto 1.6rem}
.srch input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:.7rem 1.3rem;font:inherit;outline:0;transition:border-color .2s}
.srch input:focus{border-color:var(--gold)}
.code{font-size:.72rem;color:var(--mute);letter-spacing:.06em;direction:ltr;display:inline-block}
.np{font-size:.82rem;color:var(--mute);margin:.2rem 0}
.pic{cursor:pointer}
.more{position:absolute;bottom:.8rem;inset-inline-end:.8rem;font-size:.72rem;background:var(--gold);color:#fff;border-radius:99px;padding:0 .6rem}
.ov{position:fixed;inset:0;z-index:50;background:#000a;backdrop-filter:blur(4px);display:grid;place-items:center;padding:1rem;opacity:0;pointer-events:none;transition:opacity .25s}
.ov.on{opacity:1;pointer-events:auto}
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:26px;width:min(480px,100%);max-height:92vh;overflow:auto;padding:1.4rem;transform:translateY(24px) scale(.97);transition:transform .3s cubic-bezier(.2,.9,.3,1.2)}
.ov.on .sheet{transform:none}
.sheet h3{margin:0 0 1rem;font-size:1.4rem}
.ci{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.8rem 0;border-bottom:1px solid var(--line)}
.ci b{display:block;font-weight:600}
.qty{display:flex;align-items:center;gap:.6rem}
.qty button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--soft);color:var(--ink);font-size:1rem}
.qty button:hover{border-color:var(--gold)}
.tot{display:flex;justify-content:space-between;font-weight:700;font-size:1.1rem;padding:1rem 0;border-bottom:1px solid var(--line);margin-bottom:1rem}
.fld{width:100%;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:16px;padding:.85rem 1rem;font:inherit;outline:0;margin-bottom:.8rem}
.fld:focus{border-color:var(--gold)}
.fld.bad{border-color:#e5484d}
.pays{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-bottom:1.1rem}
.pays label{display:flex;gap:.6rem;align-items:flex-start;border:1px solid var(--line);background:var(--soft);border-radius:16px;padding:.8rem;cursor:pointer;font-size:.92rem}
.pays input{accent-color:var(--gold);margin-top:.4rem}
.pays small{display:block;color:#d6336c;font-size:.76rem;line-height:1.4}
.pays label:has(input:checked){border-color:var(--gold)}
.btn.full{display:block;width:100%;text-align:center;margin-bottom:.6rem}
.ok{text-align:center}
.cd{font-family:Poppins,monospace;direction:ltr;font-size:1.7rem;letter-spacing:.12em;font-weight:600;background:var(--soft);border:1px dashed var(--gold);border-radius:16px;padding:.7rem;margin:.8rem 0}
.mp{white-space:pre-wrap;text-align:start;background:var(--soft);border-radius:14px;padding:.9rem;font-size:.85rem;color:var(--mute);margin-bottom:1rem;max-height:30vh;overflow:auto}
.gal{aspect-ratio:1;border-radius:20px;overflow:hidden;display:flex;align-items:center;justify-content:center;margin-bottom:.7rem;cursor:default}
.gal img{width:100%;height:100%;object-fit:cover}
.th{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.8rem}
.th img{width:54px;height:54px;border-radius:10px;object-fit:cover;cursor:pointer;border:2px solid transparent;opacity:.7}
.th img.on{border-color:var(--gold);opacity:1}
@media (max-width:480px){.pays{grid-template-columns:1fr}}
.bl{position:absolute;top:0;left:0;right:0;height:760px;overflow:hidden;pointer-events:none;z-index:0}
.blob{position:absolute;width:440px;height:440px;border-radius:50%;filter:blur(80px);opacity:.55;animation:blob 14s ease-in-out infinite alternate}
.b1{background:#ffb8d2;top:-120px;inset-inline-start:-100px}
.b2{background:#ffd6e6;top:160px;inset-inline-end:-140px;animation-delay:-6s}
@keyframes blob{to{transform:translate(60px,50px) scale(1.15)}}
@media (prefers-color-scheme:dark){.blob{opacity:.16}}
main{position:relative}
.hero{position:relative;z-index:1}
section{position:relative;z-index:1}
h2.rv::after{content:"";display:block;width:0;height:2px;background:var(--gold);margin:.7rem auto 0;transition:width .9s .3s}
h2.rv.in::after{width:56px}
.srch{position:relative;max-width:560px;margin:0 auto 1.8rem}
.srch span{position:absolute;inset-inline-start:1.1rem;top:50%;transform:translateY(-50%);pointer-events:none}
.srch input{padding:.9rem 1.3rem .9rem 1.3rem;padding-inline-start:3rem;font-size:1rem;box-shadow:0 8px 24px #e2457f1f;border-color:var(--line)}
.sl{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s,transform .8s}
.sl.on{opacity:1}
.card:hover .sl.on{transform:scale(1.06)}
.dots{position:absolute;bottom:.7rem;left:0;right:0;display:flex;gap:5px;justify-content:center;pointer-events:none}
.dots i{width:6px;height:6px;border-radius:50%;background:#fff9;transition:all .3s}
.dots i.on{background:#fff;width:16px;border-radius:4px}
#pdm{cursor:pointer}
@media (max-width:860px){.hero{grid-template-columns:1fr;gap:1.5rem;padding-top:2.5rem;text-align:center}.lead{margin-inline:auto}.ctas{justify-content:center}.hl{order:2}nav{display:none}.mat{padding:1.2rem}.mat .ic{width:60px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.card,.rv{opacity:1;transform:none}}
.mats{grid-template-columns:1fr 1fr 1fr}
.mat.all{background:var(--soft)}
.mat.all .ic2{font-size:2.2rem;color:var(--gold);flex:none;line-height:1}
.acts2{display:grid;gap:.45rem;margin-top:.6rem}
.acts2 .add{width:100%;padding:.45rem .9rem}
.add.buy{background:var(--gold);color:#fff}
.add.buy:hover{background:#c92f6b;border-color:#c92f6b}
.link{background:none;border:0;color:var(--gold);text-decoration:underline;font:inherit;cursor:pointer;padding:0}
.cancelb{color:#d6336c;border-color:#d6336c}
.mag{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.srch span{display:flex;color:var(--mute)}
#sbtn{display:flex;align-items:center;padding:.35rem .7rem}
#sbtn .mag{width:17px;height:17px}
@media (max-width:860px){.mats{grid-template-columns:1fr 1fr}.mat.all{grid-column:1/-1;padding:.8rem 1.2rem}.mat.all .ic2{display:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="100"><stop offset="0" stop-color="#e6c887"/><stop offset=".55" stop-color="#b98a3a"/><stop offset="1" stop-color="#8a6320"/></linearGradient>
<linearGradient id="steel" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="100"><stop offset="0" stop-color="#f3f5f7"/><stop offset=".55" stop-color="#a5afb8"/><stop offset="1" stop-color="#68727b"/></linearGradient>
</defs></svg>
<div class="bar" data-t="bar"></div>
<header>
  <a class="brand" href="#top"><img src="logo.jpg" alt="Cookies Accessories logo">COOKIES</a>
  <nav><a href="#shop" data-t="nShop"></a><a href="#about" data-t="nAbout"></a><a href="#contact" data-t="nContact"></a></nav>
  <div class="tools">
    <button class="pill" id="sbtn" aria-label="Search"><svg class="mag" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
    <div class="dd" id="dd">
      <button class="pill" id="ddb" aria-haspopup="true" aria-expanded="false"><span data-t="langLabel"></span> ▾</button>
      <div class="menu"><button data-l="ar">العربية</button><button data-l="en">English</button></div>
    </div>
    <button class="pill" id="open"><span data-t="cart"></span> (<span id="count">0</span>)</button>
  </div>
</header>

<main id="top"><div class="bl" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i></div>
<div class="hero">
  <div class="hl">
    <h1 class="disp" id="h1" data-t="h1"></h1>
    <p class="lead" data-t="heroP"></p>
    <div class="ctas"><a class="btn" href="#shop" data-t="heroBtn"></a><a class="btn ghost" id="msn2" target="_blank" rel="noopener" data-t="chat"></a></div>
  </div>
  <div class="orb">
    <svg class="spin" viewBox="0 0 300 300" aria-hidden="true"><defs><path id="cp" d="M150,150 m-122,0 a122,122 0 1,1 244,0 a122,122 0 1,1 -244,0"/></defs><text><textPath href="#cp" textLength="750" lengthAdjust="spacing">COOKIES ACCESSORIES ✦ BEADS &amp; ACCESSORIES ✦ COOKIES ACCESSORIES ✦ </textPath></text></svg>
    <img src="logo.jpg" alt="Cookies Accessories – Beads &amp; Accessories">
    <span class="tw" style="top:6%;inset-inline-end:10%">✦</span><span class="tw" style="bottom:12%;inset-inline-start:4%;animation-delay:1.2s">✦</span>
  </div>
</div>

<section id="shop">
  <h2 class="disp rv" data-t="shop"></h2>
  <div class="srch"><span aria-hidden="true"><svg class="mag" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></span><input id="q" type="search" autocomplete="off"></div>
  <div class="mats">
    <button class="mat all" data-m="" aria-pressed="true"><div><b data-t="all"></b><span data-t="allD"></span></div><span class="ic2" aria-hidden="true">✦</span></button>
    <button class="mat gold" data-m="gold" aria-pressed="false"><div><b data-t="gold"></b><span data-t="goldD"></span></div><svg viewBox="0 0 100 100" class="ic" aria-hidden="true"><circle cx="50" cy="62" r="22" stroke="url(#gold)" fill="none" stroke-width="5"/><polygon points="50,10 63,25 50,40 37,25" fill="url(#gold)"/></svg></button>
    <button class="mat steel" data-m="steel" aria-pressed="false"><div><b data-t="steel"></b><span data-t="steelD"></span></div><svg viewBox="0 0 100 100" class="ic" aria-hidden="true"><path d="M16 18Q50 96 84 18" stroke="url(#steel)" fill="none" stroke-width="5" stroke-linecap="round" stroke-dasharray="7 4"/><circle cx="50" cy="66" r="8" fill="url(#steel)"/></svg></button>
  </div>
  <div class="cats" id="cats" role="group"></div>
  <div class="grid" id="grid"></div>
</section>

<section class="about" id="about">
  <h2 class="disp rv" data-t="aboutH"></h2>
  <p class="rv" data-t="aboutP"></p>
</section>
</main>

<footer id="contact">
  <a class="btn" id="msn3" target="_blank" rel="noopener" data-t="chat"></a>
  <p>© 2026 Cookies Accessories</p>

  d.className="fly";d.textContent="✦";d.style.cssText="left:"+r.left+"px;top:"+r.top+"px;font-size:22px";document.body.appendChild(d);
  spark(r.left+r.width/2,r.top+r.height/2,7,50);
  var o=$("open");
  if(RM){d.remove();return}
  d.animate([{transform:"translate(0,0) scale(1)"},{transform:"translate("+(c.left-r.left)+"px,"+(c.top-r.top)+"px) scale(.5) rotate(360deg)"}],{duration:700,easing:"cubic-bezier(.5,-0.3,.7,1)"}).onfinish=function(){d.remove();o.classList.remove("bump");void o.offsetWidth;o.classList.add("bump")};
}
document.addEventListener("click",function(e){
  var tg=e.target;
  if(tg.classList&&tg.classList.contains("ov")){closeOv(tg.id);return}
  if(!tg.closest("#dd")){$("dd").classList.remove("open");$("ddb").setAttribute("aria-expanded","false")}
  if(tg.id=="pdm"){stopPd();return}
  var g=tg.closest("[data-g]");if(g){stopPd();setPd(+g.dataset.g);return}
  var b=tg.closest("button");
  if(!b){var v=tg.closest("[data-v]");if(v)openPd(v.dataset.v);return}
  var d=b.dataset;
  if(d.c){ty=d.c;render()}
  if(d.m!==undefined){mat=d.m;render();toGrid()}
  if(d.a){addCart(d.a);fly(b)}
  if(d.k)ask(d.k);
  if(d.b)buyNow(d.b);
  if(d.cx)cancelOrder();
  if(d.u)addCart(d.u);
  if(d.d){var c=cart.find(function(x){return x.id==d.d});if(c){c.q--;if(c.q<1)cart.splice(cart.indexOf(c),1)}draw()}
  if(d.fin)finish();
  if(d.cp){copy(co.done.m);showToast(t("asked"))}
  if(d.x)closeOv(d.x);
  if(d.l){L=d.l;try{localStorage.setItem("lang",L)}catch(x){}lang();$("dd").classList.remove("open")}
});
document.addEventListener("input",function(e){
  var i=e.target;
  if(i.id=="cfn")co.name=i.value;
  if(i.id=="cfp")co.phone=i.value;
  if(i.name=="pay")co.pay=i.value;
});
document.addEventListener("keydown",function(e){if(e.key=="Escape")document.querySelectorAll(".ov.on").forEach(function(o){closeOv(o.id)})});
$("ddb").onclick=function(e){e.stopPropagation();var o=$("dd").classList.toggle("open");this.setAttribute("aria-expanded",o)};
$("open").onclick=function(){co.bad=false;co.done=null;co.cancelled=null;drawCo();$("co").classList.add("on")};
$("sbtn").onclick=function(){$("q").scrollIntoView({behavior:"smooth",block:"center"});setTimeout(function(){$("q").focus()},500)};
$("q").oninput=function(){qs=this.value;render()};
// load products from products.json (the admin writes it); keep the defaults if it cannot be read
fetch("products.json?v="+Date.now()).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
  var a=Array.isArray(d)?d:(d.products||[]);
  if(!Array.isArray(d)&&d.categories&&d.categories.length)CATS=d.categories;
  P=a.filter(function(x){return !x.hidden}).map(function(x,i){
    return {id:x.id||"p"+i,code:x.code||"CK-"+(i+1),ar:x.ar,en:x.en,cat:x.cat||x.type,mat:x.mat,price:x.price>0?+x.price:null,hp:x.showPrice===false,imgs:x.imgs&&x.imgs.length?x.imgs:(x.img?[x.img]:[]),status:x.status||"in"}});
}).catch(function(){}).then(lang);
lang();
