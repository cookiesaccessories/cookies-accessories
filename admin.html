<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Cookies Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0c09;--card:#1a1611;--line:#33291a;--ink:#f6efe0;--mute:#b0a690;--gold:#e8a935;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% 0,#2e2312,var(--bg) 60%) fixed;color:var(--ink);font-family:Cairo,system-ui,sans-serif;min-height:100vh}
button,input,select{font:inherit}
.hide{display:none!important}
.wrap{max-width:1000px;margin:auto;padding:1.5rem 5vw 6rem}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:1.5rem;max-width:440px;margin:8vh auto 0;animation:in .6s both}
@keyframes in{from{opacity:0;transform:translateY(20px) scale(.97)}}
h1{margin:0 0 .3rem;font-size:1.5rem;background:linear-gradient(100deg,#b8821a,#fff6cf,#e8a935);-webkit-background-clip:text;background-clip:text;color:transparent}
p.m{color:var(--mute);margin:.2rem 0 1rem;font-size:.9rem}
label{display:block;font-size:.85rem;color:var(--mute);margin-top:.8rem}
input,select{width:100%;background:#0e0c09;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:.55rem .8rem;margin-top:.25rem}
input:focus,select:focus{outline:2px solid var(--gold)}
.btn{background:var(--gold);color:#141414;border:0;border-radius:99px;padding:.6rem 1.4rem;font-weight:700;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.95)}
.btn.o{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.s{padding:.25rem .8rem;font-size:.8rem}
.err{color:#ff8a7a;min-height:1.4rem;font-size:.9rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1.5rem}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1rem}
.it{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;animation:in .5s both}
.th{aspect-ratio:16/10;background:#14110c;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:.8rem}
.th img{width:100%;height:100%;object-fit:cover}
.bd{padding:.8rem 1rem}
.bd b{display:block}
.tag{display:inline-block;font-size:.72rem;padding:0 .6rem;border-radius:99px;color:#141414;background:var(--gold)}
.tag.steel{background:#c3cbd3}
.acts{display:flex;gap:.4rem;margin-top:.7rem;flex-wrap:wrap}
.off{opacity:.45}
dialog{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:18px;width:min(460px,92vw);padding:1.4rem}
dialog::backdrop{background:#000a}
.bar{position:fixed;bottom:0;inset-inline:0;background:#1a1611ee;border-top:1px solid var(--gold);padding:.8rem 5vw calc(.8rem + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:1rem;transform:translateY(110%);transition:transform .4s}
.bar.on{transform:none}
.toast{position:fixed;top:1rem;left:50%;transform:translate(-50%,-200%);background:var(--gold);color:#141414;padding:.6rem 1.2rem;border-radius:12px;font-weight:600;transition:transform .4s;z-index:9}
.toast.on{transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<div class="box" id="login">
  <h1>Cookies Admin</h1>
  <p class="m">دخول الأدمن بتوكن جيت هاب. محدش يقدر يعدّل غير اللي معاه توكن له صلاحية الكتابة على الريبو.</p>
  <label>اسم حساب جيت هاب (Username)<input id="o" autocomplete="off"></label>
  <label>اسم الريبو (Repository)<input id="r" autocomplete="off"></label>
  <label>البرانش<input id="b" value="main"></label>
  <label>GitHub Token<input id="k" type="password" autocomplete="off"></label>
  <label style="display:flex;gap:.5rem;align-items:center"><input id="rem" type="checkbox" style="width:auto;margin:0" checked> افتكرني على الجهاز ده</label>
  <div class="err" id="err"></div>
  <button class="btn" id="go">دخول</button>
</div>

<div class="wrap hide" id="app">
  <div class="top">
    <div><h1>منتجات Cookies Accessories</h1><p class="m" id="cnt"></p></div>
    <div><button class="btn" id="add">+ منتج جديد</button> <a class="btn o" href="index.html" target="_blank" style="text-decoration:none;display:inline-block">شوف الموقع</a> <button class="btn o" id="out">خروج</button></div>
  </div>
  <div class="list" id="list"></div>
</div>

<div class="bar" id="bar"><span>في تغييرات لسه ماتنشرتش على الموقع</span><button class="btn" id="pub">حفظ ونشر</button></div>

<dialog id="dlg">
  <form method="dialog" id="f">
    <h1 id="ft">منتج جديد</h1>
    <label>الاسم بالعربي<input id="nAr" required></label>
    <label>الاسم بالإنجليزي<input id="nEn" required></label>
    <label>القسم<select id="tp"></select></label>
    <label>الخامة<select id="mt"></select></label>
    <label>السعر (جنيه)<input id="pr" type="number" min="0" required></label>
    <label>الصورة (اختياري)<input id="im" type="file" accept="image/*"></label>
    <label style="display:flex;gap:.5rem;align-items:center"><input id="hd" type="checkbox" style="width:auto;margin:0"> مخفي عن الموقع</label>
    <div style="margin-top:1.2rem;display:flex;gap:.5rem"><button class="btn" id="sv" type="submit">حفظ</button><button class="btn o" type="button" id="cx">إلغاء</button></div>
  </form>
</dialog>

<script>
var $=function(i){return document.getElementById(i)};
var TY={Rings:"خواتم",Necklaces:"سلاسل",Earrings:"حلقان",Bracelets:"أساور",Anklets:"خلاخيل"},MT={gold:"دهب صيني",steel:"استانليس"};
var cfg={},data=[],sha="",pend={},prev={},edit=null;
try{cfg=JSON.parse(localStorage.getItem("cfg")||"{}")}catch(e){}
$("tp").innerHTML=Object.keys(TY).map(function(k){return'<option value="'+k+'">'+TY[k]+'</option>'}).join("");
$("mt").innerHTML=Object.keys(MT).map(function(k){return'<option value="'+k+'">'+MT[k]+'</option>'}).join("");
if(cfg.owner){$("o").value=cfg.owner;$("r").value=cfg.repo;$("b").value=cfg.branch}
if(cfg.token){$("k").value=cfg.token;login()}

function api(p,o){o=o||{};
  return fetch("https://api.github.com/repos/"+cfg.owner+"/"+cfg.repo+p,Object.assign({},o,{headers:{Authorization:"Bearer "+cfg.token,Accept:"application/vnd.github+json","Content-Type":"application/json"}}))
  .then(function(r){return r.json().catch(function(){return{}}).then(function(j){if(!r.ok)throw new Error(j.message||r.status);return j})})}
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("on");setTimeout(function(){t.classList.remove("on")},3500)}
function dirty(){$("bar").classList.add("on");window.onbeforeunload=function(){return 1}}

async function login(){
  var tok=$("k").value.trim();
  cfg={owner:$("o").value.trim(),repo:$("r").value.trim(),branch:$("b").value.trim()||"main",token:tok};
  $("err").textContent="";
  try{
    var r=await api("");
    if(!r.permissions||!r.permissions.push)throw new Error("التوكن ده ملوش صلاحية الكتابة على الريبو");
    try{var f=await api("/contents/products.json?ref="+cfg.branch);sha=f.sha;data=JSON.parse(decodeURIComponent(escape(atob(f.content.replace(/\n/g,"")))))}
    catch(e){if(!/not found/i.test(e.message))throw e;data=[];sha=""}
    if($("rem").checked)localStorage.setItem("cfg",JSON.stringify(cfg));
    $("login").classList.add("hide");$("app").classList.remove("hide");draw();
  }catch(e){$("err").textContent="مش قادر أدخل: "+e.message}
}
$("go").onclick=login;
$("out").onclick=function(){localStorage.removeItem("cfg");location.reload()};

function draw(){
  $("cnt").textContent=data.length+" منتج";
  $("list").innerHTML=data.map(function(p,i){
    var src=prev[p.img]||p.img;
    return'<div class="it'+(p.hidden?" off":"")+'" style="animation-delay:'+i*40+'ms"><div class="th">'+(src?'<img src="'+src+'" alt="">':"بدون صورة")+'</div><div class="bd"><b>'+p.ar+'</b><small>'+p.en+'</small><div><span class="tag '+p.mat+'">'+MT[p.mat]+'</span> '+TY[p.type]+' · '+p.price+' جنيه'+(p.hidden?" · مخفي":"")+'</div><div class="acts"><button class="btn s" data-e="'+i+'">تعديل</button><button class="btn o s" data-h="'+i+'">'+(p.hidden?"إظهار":"إخفاء")+'</button><button class="btn o s" data-d="'+i+'">حذف</button></div></div></div>'}).join("")||'<p class="m">لسه مفيش منتجات. دوس "منتج جديد".</p>';
}
$("list").onclick=function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.dataset.e!==undefined)open(+b.dataset.e);
  if(b.dataset.h!==undefined){data[b.dataset.h].hidden=!data[b.dataset.h].hidden;dirty();draw()}
  if(b.dataset.d!==undefined&&confirm("تحذف المنتج ده؟")){data.splice(b.dataset.d,1);dirty();draw()}
};
function open(i){
  edit=i;var p=i==null?{ar:"",en:"",type:"Rings",mat:"gold",price:"",hidden:false}:data[i];
  $("ft").textContent=i==null?"منتج جديد":"تعديل المنتج";
  $("nAr").value=p.ar;$("nEn").value=p.en;$("tp").value=p.type;$("mt").value=p.mat;$("pr").value=p.price;$("hd").checked=!!p.hidden;$("im").value="";
  $("dlg").showModal();
}
$("add").onclick=function(){open(null)};
$("cx").onclick=function(){$("dlg").close()};
function resize(file){return new Promise(function(res){
  var im=new Image();im.onload=function(){var s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.85))};
  im.src=URL.createObjectURL(file)})}
$("f").onsubmit=async function(){
  var p=edit==null?{id:"p"+Date.now()}:data[edit];
  p.ar=$("nAr").value.trim();p.en=$("nEn").value.trim();p.type=$("tp").value;p.mat=$("mt").value;p.price=+$("pr").value;p.hidden=$("hd").checked;
  var f=$("im").files[0];
  if(f){var d=await resize(f),path="images/"+p.id+"-"+Date.now()+".jpg";pend[path]=d.split(",")[1];prev[path]=d;p.img=path}
  p.img=p.img||"";
  if(edit==null)data.push(p);
  dirty();draw();
};
$("pub").onclick=async function(){
  this.disabled=true;
  try{
    for(var path in pend){await api("/contents/"+path,{method:"PUT",body:JSON.stringify({message:"Add image",content:pend[path],branch:cfg.branch})})}
    pend={};
    var body={message:"Update products",content:btoa(unescape(encodeURIComponent(JSON.stringify(data,null,1)))),branch:cfg.branch};
    if(sha)body.sha=sha;
    var r=await api("/contents/products.json",{method:"PUT",body:JSON.stringify(body)});
    sha=r.content.sha;$("bar").classList.remove("on");window.onbeforeunload=null;
    toast("تم النشر. الموقع بيتحدث خلال دقيقة تقريباً");
  }catch(e){toast("فشل النشر: "+e.message)}
  this.disabled=false;
};
</script>
</body>
</html>
