<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src https://api.github.com https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'">
<title>لوحة الإدارة | Cookies Accessories</title>
<link rel="icon" href="logo.jpg">
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&family=Poppins:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e080b;--bg2:#170e13;--card:#1d1217;--ink:#f6efe0;--mut:#a99d84;--line:#33202a;--g1:#d6336c;--g2:#ff8fb8;--grad:linear-gradient(135deg,#e2457f,#ff8fb8);--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(circle at 80% -10%,#2b1220,var(--bg) 55%) fixed;color:var(--ink);font-family:Cairo,Tahoma,sans-serif;line-height:1.55}
button,input,select{font-family:inherit;font-size:.95rem;color:inherit}
input,select{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;outline:0}
input:focus,select:focus{border-color:var(--g2)}
.lat{font-family:Poppins,sans-serif}.mut{color:var(--mut);font-size:.88rem}
.btn{background:var(--grad);color:#fff;border:0;padding:10px 18px;border-radius:12px;cursor:pointer;font-weight:800;transition:.2s}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.o{background:transparent;border:1px solid var(--line);color:var(--ink)}.btn.o:hover{border-color:var(--g2)}
.btn.sm{padding:6px 12px;font-size:.82rem}.btn.r{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lbox{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:24px;padding:30px;display:flex;flex-direction:column;gap:12px;text-align:center;animation:in .6s both;box-shadow:0 0 60px -20px #e2457f}
.lbox img{width:96px;height:96px;border-radius:50%;margin:auto;box-shadow:0 0 0 4px #3a2030}
@keyframes in{from{opacity:0;transform:translateY(18px) scale(.97)}}
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:var(--card);border-inline-end:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px;font-weight:800;font-size:1.1rem}.brand img{width:40px;height:40px;border-radius:50%}
.nv{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;background:none;border:0;cursor:pointer;color:var(--mut);font-weight:600;text-align:start;width:100%;transition:.2s}
.nv:hover{background:var(--bg2);color:var(--ink)}.nv.on{background:var(--grad);color:#fff}
.sp{flex:1}
main{padding:26px 30px 120px;max-width:1150px;width:100%}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:22px}.top h1{font-size:1.7rem;font-weight:900}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
.st{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;animation:in .5s both}.st b{display:block;font-size:1.9rem;font-weight:900}.st small{color:var(--mut)}
.st.hot{border-color:var(--g2);box-shadow:0 0 30px -10px #e2457f}
.pn{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:18px}.pn h3{margin-bottom:8px}
.tool{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.tool input{flex:1;min-width:160px}.tool select{width:auto}
.pr{display:grid;grid-template-columns:60px 1fr auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:10px;animation:in .4s both}
.pr.off{opacity:.5}
.pr .im{width:60px;height:60px;border-radius:12px;background:var(--bg2);object-fit:cover;display:grid;place-items:center;font-size:1.6rem}
.tag{display:inline-block;padding:0 10px;border-radius:99px;font-size:.74rem;font-weight:800;color:#141414;background:var(--grad)}.tag.steel{background:linear-gradient(135deg,#fff,#b9c2cb)}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.acts select{width:auto}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);z-index:50;display:grid;place-items:center;padding:16px}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:24px;width:min(500px,100%);max-height:92vh;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:11px;animation:in .3s both}
.save{position:fixed;bottom:18px;inset-inline:0;margin:auto;width:min(560px,92vw);background:var(--card);border:1px solid var(--g2);border-radius:18px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:40;box-shadow:0 10px 40px -10px #e2457f;animation:in .3s both}
.toast{position:fixed;top:18px;inset-inline:0;margin:auto;width:max-content;max-width:92vw;background:var(--card);border:1px solid var(--g2);border-radius:14px;padding:12px 20px;z-index:90;font-weight:700;box-shadow:0 10px 40px -10px #e2457f;animation:in .3s both}
.empty{text-align:center;color:var(--mut);padding:36px}
@media(max-width:860px){.shell{grid-template-columns:1fr}.side{position:fixed;top:auto;bottom:0;inset-inline:0;height:auto;flex-direction:row;padding:8px;z-index:45;border-inline-end:0;border-top:1px solid var(--line);padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}.brand,.sp,.side .hm{display:none}.nv{flex-direction:column;gap:2px;padding:6px 4px;font-size:.72rem;text-align:center;justify-content:center}main{padding:18px 14px 150px}.save{bottom:84px}.pr{grid-template-columns:52px 1fr}.pr .acts{grid-column:1/-1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.bars{display:flex;align-items:flex-end;gap:5px;height:140px;margin-top:12px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:.68rem;color:var(--mut);gap:3px}
.bar i{display:block;width:100%;background:var(--grad);border-radius:6px 6px 0 0;min-height:2px;transition:height .6s}
.tb{width:100%;border-collapse:collapse;font-size:.9rem}.tb th{color:var(--mut);font-weight:600;text-align:start;padding:6px 8px}.tb td{padding:8px;border-top:1px solid var(--line)}
.tb .rk{width:34px;font-weight:800;color:var(--g2)}
.tbw{overflow-x:auto}
</style>
</head>
<body>
<div id="app"></div>
<script>
const C=window.CONFIG||{};let BR=C.BRANCH||"main",lerr="";
function guess(){var h=location.hostname,seg=location.pathname.split("/")[1]||"";if(!h.endsWith("github.io"))return"";return h.split(".")[0]+"/"+(seg&&!/\.html?$/.test(seg)?seg:h)}
let REPO="";try{REPO=localStorage.getItem("ck_repo")||""}catch(e){}REPO=REPO||C.REPO||guess();
const ST={in:"متوفر",soon:"قريبًا",out:"المخزون خلص"},MT={gold:"دهب صيني",steel:"استانليس"};
const DEF=[{id:"Rings",ar:"خواتم",en:"Rings"},{id:"Necklaces",ar:"سلاسل",en:"Necklaces"},{id:"Earrings",ar:"حلقان",en:"Earrings"},{id:"Bracelets",ar:"أساور",en:"Bracelets"},{id:"Anklets",ar:"خلاخيل",en:"Anklets"}];
let tok="",products=[],cats=[],sha="",view="dash",ready=false,dirty=false,pm=false,editing=null,pf=null,draft="",pq="",pc="all";
try{tok=localStorage.getItem("ck_tok")||""}catch(e){}
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const b64=s=>{let b="";new TextEncoder().encode(s).forEach(c=>b+=String.fromCharCode(c));return btoa(b)};
const gh=(p,o={})=>fetch("https://api.github.com/repos/"+REPO+"/contents/"+p,{...o,headers:{Authorization:"Bearer "+tok,Accept:"application/vnd.github+json","Content-Type":"application/json"}});
const catOf=id=>cats.find(c=>c.id===id);
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3500)}

async function load(){
  lerr="";
  if(!/^[^\/\s]+\/[^\/\s]+$/.test(REPO)){lerr="اكتب اسم الريبو بالشكل ده: اسمك/اسم-الريبو";return false}
  try{
    const rr=await fetch("https://api.github.com/repos/"+REPO,{headers:{Authorization:"Bearer "+tok,Accept:"application/vnd.github+json"}});
    if(rr.status===401){lerr="التوكن غلط أو منتهي. اعمل توكن جديد وانسخه كامل";return false}
    if(rr.status===404){lerr="الريبو "+REPO+" مش موجود، أو التوكن مش واخد صلاحية عليه. راجع الاسم، وتأكد إنك اخترت الريبو ده وقت عمل التوكن";return false}
    if(!rr.ok){lerr="جيت هاب رد بخطأ "+rr.status;return false}
    const info=await rr.json();
    if(info.permissions&&info.permissions.push===false){lerr="التوكن ده للقراءة بس. لازم تديله Contents: Read and write";return false}
    if(!C.BRANCH)BR=info.default_branch||"main";
    const r=await gh("products.json?ref="+BR);
    if(r.status===404){products=[];cats=JSON.parse(JSON.stringify(DEF));sha="";dirty=false;ready=true;return true}
    if(!r.ok){lerr="مش قادر أقرا products.json (خطأ "+r.status+")";return false}
    const j=await r.json();sha=j.sha;
    const d=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\n/g,"")),c=>c.charCodeAt(0))));
    if(Array.isArray(d)){products=d;cats=JSON.parse(JSON.stringify(DEF))}else{products=d.products||[];cats=d.categories||JSON.parse(JSON.stringify(DEF))}
    let fix=false;products.forEach(p=>{p.cat=p.cat||p.type;delete p.type;p.status=p.status||"in";p.imgs=p.imgs||(p.img?[p.img]:[]);p.price=p.price>0?+p.price:null;if(!p.code){p.code=newCode();fix=true}});
    dirty=fix;ready=true;return true
  }catch(e){lerr="مش قادر أتصل بجيت هاب أو ملف products.json بايظ. اتأكد من النت وجرّب تاني";return false}
}
async function login(){
  tok=$("#tk").value.trim();REPO=$("#rp").value.trim().replace(/^https?:\/\/github\.com\//,"").replace(/\.git$/,"").replace(/\/+$/,"");
  if(!tok){$("#le").textContent="الصق التوكن الأول";return}
  const b=$("#lb");b.disabled=true;b.textContent="جاري الدخول...";$("#le").textContent="";
  if(await load()){try{localStorage.setItem("ck_tok",tok);localStorage.setItem("ck_repo",REPO)}catch(e){}render()}
  else{b.disabled=false;b.textContent="دخول";$("#le").textContent=lerr}}
function logout(){try{localStorage.removeItem("ck_tok")}catch(e){}tok="";ready=false;render()}

/* products */
const OU=C.ORDERS_URL||"";
function newCode(){const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let c;do{c="CK-"+Array.from({length:5},()=>A[Math.floor(Math.random()*A.length)]).join("")}while(products.some(p=>p.code===c));return c}
const src=s=>s.startsWith("data:")?s:"./"+s;
function openP(id){editing=id||null;const p=products.find(x=>x.id===id);pf=p?{...p,imgs:[...(p.imgs||[])]}:{ar:"",en:"",price:"",status:"in",mat:"gold",cat:(cats[0]||{}).id||"",hidden:false,imgs:[],code:""};pm=true;render()}
function closeP(){pm=false;render()}
function igHtml(){return pf.imgs.map((s,i)=>`<div style="position:relative"><img src="${esc(src(s))}" alt="" style="width:70px;height:70px;object-fit:cover;border-radius:10px;${i?"":"outline:2px solid var(--g2)"}"><button type="button" class="btn r sm" style="position:absolute;top:-6px;inset-inline-end:-6px;padding:0 7px;background:var(--card)" onclick="rmImg(${i})">✕</button></div>`).join("")}
function rmImg(i){pf.imgs.splice(i,1);$("#ig").innerHTML=igHtml()}
function resize(f){return new Promise(res=>{const i=new Image();i.onload=()=>{const k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.82))};i.src=URL.createObjectURL(f)})}
async function pick(el){for(const f of [...el.files]){if(pf.imgs.length>=8){toast("أقصى عدد 8 صور");break}pf.imgs.push(await resize(f))}el.value="";$("#ig").innerHTML=igHtml()}
function saveP(){
  const ar=$("#fa").value.trim(),en=$("#fe").value.trim(),pv=$("#fp").value.trim(),price=pv===""?null:+pv,cat=$("#fc").value,mat=$("#fm").value,status=$("#fs").value,hidden=$("#fh").checked,hp=!$("#fsp").checked;
  if(!ar||!en){toast("اكتب الاسم بالعربي والإنجليزي");return}if(!cat){toast("اختار القسم الأول");return}
  if(price!==null&&!(price>0)){toast("السعر لازم يكون رقم أكبر من صفر، أو سيبه فاضي");return}
  if(hp&&price===null){toast("اكتب السعر الأول: هيتسجل عندك بس ومش هيظهر في الموقع");return}
  const imgs=pf.imgs,img=imgs[0]||"",showPrice=!hp;
  if(editing)Object.assign(products.find(x=>x.id===editing),{ar,en,price,showPrice,cat,mat,status,hidden,imgs,img});
  else products.unshift({id:"p"+Date.now(),code:newCode(),ar,en,price,showPrice,cat,mat,status,hidden,imgs,img});
  dirty=true;pm=false;render()}
function setSt(id,v){products.find(p=>p.id===id).status=v;dirty=true;render()}
function del(id){if(!confirm("حذف المنتج؟"))return;products=products.filter(p=>p.id!==id);dirty=true;render()}
function pform(){const e=pf;return `<div class="ov"><div class="sheet"><h2>${editing?"تعديل منتج":"إضافة منتج جديد"}</h2>
  ${e.code?`<p class="mut lat" dir="ltr">${esc(e.code)}</p>`:'<p class="mut">كود المنتج بيتعمل تلقائي لما تضيفه</p>'}
  <input id="fa" placeholder="الاسم بالعربي" value="${esc(e.ar)}"><input id="fe" placeholder="Name in English" value="${esc(e.en)}" dir="ltr">
  <select id="fc">${cats.map(c=>`<option value="${esc(c.id)}" ${c.id===e.cat?"selected":""}>${esc(c.ar)}</option>`).join("")||'<option value="">أضف قسم الأول</option>'}</select>
  <select id="fm">${Object.entries(MT).map(([k,v])=>`<option value="${k}" ${k===e.mat?"selected":""}>${v}</option>`).join("")}</select>
  <input id="fp" type="number" min="0" placeholder="السعر بالجنيه (اختياري)" value="${e.price==null?"":esc(e.price)}"><div style="background:var(--bg2);border:1px solid var(--g1);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px">
    <label style="display:flex;gap:10px;align-items:center;cursor:pointer;font-weight:700"><input id="fsp" type="checkbox" style="width:auto" ${e.showPrice===false?"":"checked"}> إظهار السعر في الموقع</label>
    <p class="mut">لو شلت العلامة: الموقع هيكتب "السعر عند السؤال" والعميل مش هيشوف الرقم، لكن السعر اللي كتبته فوق بيتسجل عندك في الطلبات والحسابات.</p>
    <p class="mut" style="font-size:.8rem">تنبيه: السعر بيتخزن في ملف products.json على جيت هاب، فمش مخفي تقنيًا عن اللي يفتح الملف نفسه.</p></div>
  <select id="fs">${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${k===e.status?"selected":""}>${v}</option>`).join("")}</select>
  <input type="file" accept="image/*" multiple onchange="pick(this)"><div id="ig" class="acts">${igHtml()}</div><p class="mut" style="margin-top:-4px">أول صورة هي الأساسية، ولحد 8 صور للمنتج.</p>
  <label class="mut" style="display:flex;gap:8px;align-items:center"><input id="fh" type="checkbox" style="width:auto" ${e.hidden?"checked":""}> مخفي عن الموقع</label>
  <div class="acts"><button class="btn" onclick="saveP()">${editing?"تحديث":"إضافة"}</button><button class="btn o" onclick="closeP()">إلغاء</button></div></div></div>`}
function plist(){
  const q=pq.toLowerCase(),l=products.filter(p=>(pc==="all"||p.cat===pc)&&(p.ar+" "+p.en+" "+(p.code||"")).toLowerCase().includes(q));
  $("#pl").innerHTML=l.map((p,i)=>{const im=(p.imgs||[])[0];return `<div class="pr ${p.hidden?"off":""}" style="animation-delay:${Math.min(i,10)*30}ms">${im?`<img class="im" src="${esc(src(im))}" alt="">`:'<div class="im">💍</div>'}<div><b>${esc(p.ar)}</b> <span class="mut lat" dir="ltr">${esc(p.en)}</span><div class="mut"><span class="tag ${p.mat}">${MT[p.mat]||""}</span> ${esc((catOf(p.cat)||{ar:"بدون قسم"}).ar)} — ${p.price?p.price+" جنيه"+(p.showPrice===false?' <span class="tag" style="background:#ef4444;color:#fff">السعر مخفي عن الموقع</span>':""):"بدون سعر"}${p.hidden?" — مخفي":""} — <span class="lat" dir="ltr">${esc(p.code||"")}</span>${(p.imgs||[]).length>1?" — "+p.imgs.length+" صور":""}</div></div>
  <div class="acts"><select data-i="${esc(p.id)}" onchange="setSt(this.dataset.i,this.value)">${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${k===p.status?"selected":""}>${v}</option>`).join("")}</select><button class="btn o sm" data-i="${esc(p.id)}" onclick="openP(this.dataset.i)">تعديل</button><button class="btn r sm" data-i="${esc(p.id)}" onclick="del(this.dataset.i)">حذف</button></div></div>`}).join("")||'<div class="empty">لا توجد منتجات</div>'}

/* orders */
const OS={pending:"جاري عمل الطلبية",done:"تمت",cancelled:"اتلغت"},PAY={cod:"كاش عند الاستلام (ديبوست 50% على الأقل)",insta:"إنستا باي"};
let orders=[],oerr="",okey="";try{okey=localStorage.getItem("ck_okey")||""}catch(e){}
const money=n=>(n||0).toLocaleString("en-US")+" جنيه";
async function loadOrders(quiet){
  if(OU&&okey){
    try{let tx="",j=null;
      try{const r=await fetch(OU+"?action=list&key="+encodeURIComponent(okey));tx=await r.text()}catch(e){throw new Error("net")}
      try{j=JSON.parse(tx)}catch(e){throw new Error("bad:"+tx.replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim().slice(0,180))}
      if(!j.ok){if(j.error==="key"){okey="";try{localStorage.removeItem("ck_okey")}catch(e){}oerr="مفتاح الطلبات غلط. اكتب المفتاح الصح وجرّب تاني"}else oerr="خطأ من السكريبت: "+(j.msg||j.error||"");orders=[]}
      else{if(quiet&&j.orders.length>orders.length)toast("🔔 وصل طلب جديد");orders=j.orders.filter(o=>o&&/^CK-[A-Z0-9]{6}$/.test(String(o.code))).map(o=>({code:String(o.code),createdAt:String(o.createdAt),name:String(o.name),phone:String(o.phone),payment:String(o.payment),status:String(o.status),total:Number(o.total)||0,items:Array.isArray(o.items)?o.items.map(i=>({c:String(i.c),ar:String(i.ar||""),en:String(i.en||""),q:Number(i.q)||0,p:i.p==null?null:(Number(i.p)||0),h:i.h?1:0})):[]}));oerr=""}
    }catch(e){oerr=e.message==="net"?"المتصفح مقدرش يوصل للرابط. راجع إن ORDERS_URL بينتهي بـ /exec وإن النشر Anyone":(e.message.indexOf("bad:")===0?"الرابط رد بصفحة مش بيانات (غالبًا صلاحيات أو السكريبت مش مربوط بالشيت). الرد: "+e.message.slice(4):"خطأ غير متوقع")}
  }
  drawOrders()}
function saveKey(){okey=$("#ok").value.trim();oerr="";if(!okey){oerr="اكتب المفتاح";drawOrders();return}try{localStorage.setItem("ck_okey",okey)}catch(e){}loadOrders()}
function changeKey(){okey="";oerr="";try{localStorage.removeItem("ck_okey")}catch(e){}drawOrders()}
async function setOS(code,st){
  try{const r=await fetch(OU+"?action=status&key="+encodeURIComponent(okey)+"&code="+encodeURIComponent(code)+"&status="+st),j=await r.json();
    if(!j.ok)throw 0;orders.find(o=>o.code===code).status=st;toast("تم تحديث الحالة");drawOrders()}
  catch(e){toast("فشل تحديث الحالة");loadOrders()}}
function drawOrders(){
  const b=$("#ob");if(!b)return;
  if(!OU||!okey){b.innerHTML=`<div class="pn"><h3>🔐 ربط الطلبات</h3><p class="mut" style="margin-bottom:10px">${OU?"اكتب مفتاح الطلبات (ADMIN_KEY اللي في السكريبت).":"حط رابط السكريبت في config.js في ORDERS_URL الأول (الخطوات في ملف apps-script.gs)."}</p>${OU?`<input id="ok" type="password" placeholder="ADMIN_KEY" value="${esc(okey)}"><div class="acts" style="margin-top:10px"><button class="btn" onclick="saveKey()">حفظ</button></div>`:""}<p style="color:var(--bad)">${esc(oerr)}</p></div>`;return}
  const st=k=>orders.filter(o=>o.status===k),sum=a=>a.reduce((s,o)=>s+o.total,0);
  b.innerHTML=`${oerr?`<div class="pn" style="color:var(--bad)">${esc(oerr)}<div class="mut lat" style="margin:8px 0;word-break:break-all" dir="ltr">${esc(OU)}</div><a href="${esc(OU)}?action=list&key=test" target="_blank" rel="noopener" style="color:var(--g2)">🔗 افتح رابط السكريبت في تاب جديد للاختبار</a></div>`:""}
  <div class="pn"><div class="top" style="margin-bottom:8px"><h3>ملخص الطلبات</h3><span class="acts"><button class="btn o sm" onclick="loadOrders()">🔄 تحديث</button><button class="btn o sm" onclick="changeKey()">🔑 تغيير المفتاح</button></span></div>
  <table style="width:100%;border-collapse:collapse;text-align:center"><tr class="mut"><th style="text-align:start">الحالة</th><th>العدد</th><th>الفلوس</th></tr>
  ${Object.keys(OS).map(k=>`<tr style="border-top:1px solid var(--line)"><td style="text-align:start;padding:8px 0">${OS[k]}</td><td>${st(k).length}</td><td>${money(sum(st(k)))}</td></tr>`).join("")}
  <tr style="border-top:2px solid var(--g2);font-weight:800"><td style="text-align:start;padding:8px 0">الإجمالي (بدون الملغي)</td><td>${orders.length-st("cancelled").length}</td><td>${money(sum(orders)-sum(st("cancelled")))}</td></tr></table></div>
  ${orders.map(o=>`<div class="pn" style="border-inline-start:4px solid ${o.status==="done"?"var(--ok)":o.status==="cancelled"?"var(--bad)":"var(--warn)"}"><div class="top" style="margin-bottom:8px"><b class="lat" dir="ltr">${esc(o.code)}</b><span class="mut">${esc(new Date(o.createdAt).toLocaleString("ar-EG"))}</span></div>
  <div>👤 ${esc(o.name)} — <a href="tel:${esc(o.phone)}" style="color:var(--g2)" dir="ltr">${esc(o.phone)}</a></div><div class="mut">💳 ${PAY[o.payment]||esc(o.payment)}</div>
  <div style="margin:8px 0">${o.items.map(i=>`<div>• ${esc(i.ar||i.en)} <span class="mut lat" dir="ltr">(${esc(i.c)})</span> × ${i.q} = ${i.p?money(i.q*i.p)+(i.h?" (سعر غير معلن للعميل)":""):"السعر لم يتحدد"}</div>`).join("")}</div>
  <div class="acts"><b>${money(o.total)}${o.items.some(i=>!i.p)?" + أصناف بدون سعر":""}</b><select data-c="${esc(o.code)}" onchange="setOS(this.dataset.c,this.value)">${Object.entries(OS).map(([k,v])=>`<option value="${k}" ${k===o.status?"selected":""}>${v}</option>`).join("")}</select></div></div>`).join("")||'<div class="empty">لسه مفيش طلبات</div>'}`}

/* stats */
let vst=null,verr="";
async function loadStats(){
  if(OU&&okey){
    await loadOrders(false);
    try{
      const r=await fetch(OU+"?action=stats&key="+encodeURIComponent(okey)),tx=await r.text();let j=null;
      try{j=JSON.parse(tx)}catch(e){}
      if(j&&j.ok&&typeof j.total==="number"){vst=j;verr=""}
      else if(j&&j.error==="key")verr="مفتاح الطلبات غلط";
      else{vst=null;verr="السكريبت محتاج تحديث: انسخ apps-script.gs الجديد وانشره (Deploy ثم Manage deployments ثم New version)"}
    }catch(e){vst=null;verr="مش قادر أجيب إحصائيات الزيارات"}
  }
  drawStats()}
const nph=s=>{let d=String(s).replace(/\D/g,"");if(d.startsWith("20")&&d.length===12)d="0"+d.slice(2);return d};
function drawStats(){
  const b=$("#sb");if(!b)return;
  if(!OU||!okey){b.innerHTML=`<div class="pn"><h3>🔐 ربط الطلبات</h3><p class="mut" style="margin-bottom:10px">الإحصائيات بتتحسب من الطلبات والزيارات، فلازم تربط الطلبات الأول من تبويب الطلبات.</p><button class="btn" onclick="go('orders')">فتح الطلبات</button></div>`;return}
  const cust={};
  orders.forEach(o=>{const k=nph(o.phone),c=cust[k]||(cust[k]={name:o.name,phone:k,n:0,done:0,canc:0,spent:0,last:""});
    if(!c.last||o.createdAt>c.last){c.last=o.createdAt;c.name=o.name}
    if(o.status==="cancelled")c.canc++;else{c.n++;c.spent+=o.total;if(o.status==="done")c.done++}});
  const list=Object.values(cust),buyers=list.filter(c=>c.n>0).sort((x,y)=>y.n-x.n||y.spent-x.spent).slice(0,15),cancellers=list.filter(c=>c.canc>0).sort((x,y)=>y.canc-x.canc);
  const cnt=k=>orders.filter(o=>o.status===k).length,total=orders.length,canc=cnt("cancelled");
  const fd=s=>{const d=new Date(s);return isNaN(d)?"":d.toLocaleDateString("ar-EG")};
  const v=vst,max=v?Math.max(1,...v.daily.map(x=>x.n)):1;
  const card=(l,n,hot)=>`<div class="st ${hot?"hot":""}"><small>${l}</small><b>${n}</b></div>`;
  b.innerHTML=`${verr?`<div class="pn" style="color:var(--bad)">${esc(verr)}</div>`:""}
  <div class="top" style="margin-bottom:10px"><h3>👀 الزيارات</h3><button class="btn o sm" onclick="loadStats()">🔄 تحديث</button></div>
  ${v?`<div class="stats">${card("زوار النهاردة",v.today,1)}${card("آخر 7 أيام",v.d7)}${card("آخر 30 يوم",v.d30)}${card("إجمالي الزوار",v.total)}</div>
  <div class="pn"><h3>زوار آخر 14 يوم</h3><div class="bars">${v.daily.map(x=>`<div class="bar"><span>${x.n}</span><i style="height:${Math.round(x.n/max*100)}%"></i><span>${esc(x.d.slice(5).replace("-","/"))}</span></div>`).join("")}</div>
  <p class="mut" style="margin-top:8px">الزائر هو متصفح/جهاز واحد (مش شخص بالظبط)، وبيتحسب مرة في اليوم. جهازك إنت مش بيتحسب.</p></div>`:""}
  <h3 style="margin:18px 0 10px">🛒 الشراء والإلغاء</h3>
  <div class="stats">${card("إجمالي الطلبات",total)}${card("تمت",cnt("done"))}${card("جاري عمل الطلبية",cnt("pending"))}${card("اتلغت",canc)}
  ${card("نسبة الإلغاء",total?Math.round(canc/total*100)+"%":"0%")}${card("عملاء اشتروا",list.filter(c=>c.n>0).length)}${card("عملاء لغوا طلب",cancellers.length)}${v&&v.total?card("نسبة الشراء من الزوار",(list.length/v.total*100).toFixed(1)+"%"):""}</div>
  <div class="pn"><h3>🏆 أكتر العملاء شراءً</h3>${buyers.length?`<div class="tbw"><table class="tb"><tr><th></th><th>الاسم</th><th>الموبايل</th><th>الطلبات</th><th>الإجمالي</th><th>لغى</th><th>آخر طلب</th></tr>
  ${buyers.map((c,i)=>`<tr><td class="rk">${i+1}</td><td>${esc(c.name)}</td><td dir="ltr" style="text-align:end">${esc(c.phone)}</td><td>${c.n}</td><td>${money(c.spent)}</td><td style="color:${c.canc?"var(--bad)":"var(--mut)"}">${c.canc}</td><td class="mut">${esc(fd(c.last))}</td></tr>`).join("")}</table></div>
  <p class="mut" style="margin-top:8px">الترتيب بعدد الطلبات (من غير الملغي)، وبعدها بإجمالي الفلوس. العميل بيتعرف برقم موبايله.</p>`:'<div class="empty">لسه مفيش عملاء اشتروا</div>'}</div>
  <div class="pn"><h3>↩️ عملاء اشتروا ولغوا</h3>${cancellers.length?`<div class="tbw"><table class="tb"><tr><th>الاسم</th><th>الموبايل</th><th>طلبات ملغية</th><th>طلبات ماشية</th></tr>
  ${cancellers.map(c=>`<tr><td>${esc(c.name)}</td><td dir="ltr" style="text-align:end">${esc(c.phone)}</td><td style="color:var(--bad)">${c.canc}</td><td>${c.n}</td></tr>`).join("")}</table></div>`:'<div class="empty">مفيش حد لغى طلب</div>'}</div>`}

/* categories */
function setCat(id,k,v){catOf(id)[k]=v.trim();dirty=true;renderSave()}
function addCat(){const ar=$("#nca").value.trim(),en=$("#nce").value.trim();if(!ar||!en){toast("اكتب الاسم بالعربي والإنجليزي");return}cats.push({id:"c"+Date.now(),ar,en});dirty=true;render()}
function delCat(id){if(products.some(p=>p.cat===id)){toast("في منتجات تابعة للقسم ده، انقلها أو احذفها الأول");return}if(!confirm("حذف القسم؟"))return;cats=cats.filter(c=>c.id!==id);dirty=true;render()}

/* save */
async function save(){
  toast("جاري الحفظ...");
  try{
    for(const p of products){const out=[];for(const im of (p.imgs||[])){if(im.startsWith("data:")){const path="images/"+p.id+"-"+Date.now()+"-"+out.length+".jpg";const r=await gh(path,{method:"PUT",body:JSON.stringify({message:"add image",content:im.split(",")[1],branch:BR})});if(!r.ok)throw 0;out.push(path)}else out.push(im)}p.imgs=out;p.img=out[0]||""}
    const body={message:"update store",content:b64(JSON.stringify({categories:cats,products},null,2)),branch:BR};if(sha)body.sha=sha;
    const r=await gh("products.json",{method:"PUT",body:JSON.stringify(body)});
    if(!r.ok)throw 0;sha=(await r.json()).content.sha;dirty=false;toast("تم الحفظ ✅ هيظهر على الموقع بعد دقيقة تقريبًا");render()}
  catch(e){toast("فشل الحفظ. جرّب تاني أو راجع صلاحيات التوكن")}}
async function discard(){if(!confirm("تجاهل كل التغييرات اللي مش محفوظة؟"))return;await load();render()}
function renderSave(){let s=$("#sv");if(dirty&&!s){const d=document.createElement("div");d.id="sv";d.className="save";d.innerHTML='<span>⚠️ عندك تغييرات غير محفوظة</span><div class="acts"><button class="btn o sm" onclick="discard()">تجاهل</button><button class="btn sm" onclick="save()">💾 حفظ ونشر</button></div>';document.body.appendChild(d)}if(!dirty&&s)s.remove()}

/* view */
function go(v){view=v;pm=false;render();scrollTo(0,0)}
function render(){
  const old=$("#sv");if(old)old.remove();
  if(!ready){$("#app").innerHTML=`<div class="login"><div class="lbox"><img src="logo.jpg" alt=""><h2>لوحة إدارة Cookies Accessories</h2><p class="mut">سجّل دخولك لإدارة المنتجات</p>
  <input id="rp" placeholder="اسم الريبو: username/repo" value="${esc(REPO)}" dir="ltr" autocomplete="off"><input id="tk" type="password" placeholder="GitHub Token (github_pat_...)" value="${esc(tok)}" autocomplete="off"><p id="le" style="color:var(--bad);font-weight:700;font-size:.9rem">${esc(lerr)}</p>
  <button class="btn" id="lb" onclick="login()">دخول</button><p class="mut">التوكن بيتخزن في متصفحك إنت بس.</p></div></div>`;return}
  const nav=[["dash","📊","الرئيسية"],["products","💍","المنتجات"],["orders","🧾","الطلبات"],["stats","📈","الإحصائيات"],["cats","🗂️","الأقسام"]].map(n=>`<button class="nv ${view===n[0]?"on":""}" onclick="go('${n[0]}')"><span>${n[1]}</span><span>${n[2]}</span></button>`).join("");
  let body="",title="";
  if(view==="dash"){title="نظرة عامة";const n=s=>products.filter(p=>p.status===s).length;
    body=`<div class="stats"><div class="st"><small>إجمالي المنتجات</small><b>${products.length}</b></div><div class="st"><small>متوفر</small><b style="color:var(--ok)">${n("in")}</b></div><div class="st"><small>قريبًا</small><b style="color:var(--warn)">${n("soon")}</b></div><div class="st"><small>المخزون خلص</small><b style="color:var(--bad)">${n("out")}</b></div></div>
    <div class="stats"><div class="st"><small>دهب صيني</small><b>${products.filter(p=>p.mat==="gold").length}</b></div><div class="st"><small>استانليس</small><b>${products.filter(p=>p.mat==="steel").length}</b></div><div class="st"><small>مخفي عن الموقع</small><b>${products.filter(p=>p.hidden).length}</b></div><div class="st"><small>الأقسام</small><b>${cats.length}</b></div></div>
    <div class="pn"><h3>🧾 الطلبات</h3><p class="mut" style="margin-bottom:10px">${OU&&okey?"جاري التنفيذ: "+orders.filter(o=>o.status==="pending").length+" — تمت: "+orders.filter(o=>o.status==="done").length:"اربط الطلبات من تبويب الطلبات."}</p><button class="btn sm" onclick="go('orders')">فتح الطلبات</button></div>
    <div class="pn"><h3>⚡ تعديل سريع</h3><div class="acts"><button class="btn" onclick="go('products');openP()">+ إضافة منتج</button><button class="btn o" onclick="go('cats')">إدارة الأقسام</button></div></div>`}
  if(view==="products"){title="المنتجات";
    body=`<div class="tool"><input placeholder="🔍 ابحث في المنتجات" value="${esc(pq)}" oninput="pq=this.value;plist()"><select onchange="pc=this.value;plist()"><option value="all">كل الأقسام</option>${cats.map(c=>`<option value="${esc(c.id)}" ${pc===c.id?"selected":""}>${esc(c.ar)}</option>`).join("")}</select><button class="btn" onclick="openP()">+ إضافة منتج</button></div><div id="pl"></div>`}
  if(view==="orders"){title="الطلبات";body='<div id="ob"></div>'}
  if(view==="stats"){title="الإحصائيات";body='<div id="sb"></div>'}
  if(view==="cats"){title="الأقسام";
    body=`<p class="mut" style="margin-bottom:14px">الأقسام اللي بتظهر كفلاتر في الموقع، بالعربي والإنجليزي.</p><div class="cg">${cats.map(c=>`<div class="cat"><input value="${esc(c.ar)}" data-i="${esc(c.id)}" onchange="setCat(this.dataset.i,'ar',this.value)" placeholder="بالعربي"><input value="${esc(c.en)}" dir="ltr" data-i="${esc(c.id)}" onchange="setCat(this.dataset.i,'en',this.value)" placeholder="English"><div class="acts"><span class="mut">${products.filter(p=>p.cat===c.id).length} منتج</span><span class="sp" style="flex:1"></span><button class="btn r sm" data-i="${esc(c.id)}" onclick="delCat(this.dataset.i)">حذف القسم</button></div></div>`).join("")}
    <div class="cat"><b>+ قسم جديد</b><input id="nca" placeholder="بالعربي، مثلًا إسورة"><input id="nce" dir="ltr" placeholder="English, e.g. Pendants"><button class="btn sm" onclick="addCat()">إضافة</button></div></div>`}
  $("#app").innerHTML=`<div class="shell"><aside class="side"><div class="brand"><img src="logo.jpg" alt=""><span class="lat">Cookies Admin</span><small class="mut">v7</small></div>${nav}<div class="sp"></div>
  <a class="nv hm" style="text-decoration:none" href="index.html" target="_blank"><span>🌐</span><span>عرض الموقع</span></a><button class="nv hm" onclick="logout()"><span>🚪</span><span>خروج</span></button></aside>
  <main><div class="top"><h1>${title}</h1><div class="acts"><a class="btn o sm" style="text-decoration:none" href="index.html" target="_blank">🌐 الموقع</a><button class="btn o sm" onclick="logout()">خروج</button></div></div>${body}</main></div>${pm?pform():""}`;
  if(view==="products")plist();
  if(view==="orders")loadOrders(false);
  if(view==="stats")loadStats();
  renderSave();
}
(async()=>{if(tok&&await load()){render();if(OU&&okey)loadOrders(true)}else render()})();
setInterval(()=>{if(ready&&view==="orders"&&OU&&okey)loadOrders(true)},30000);
</script>
</body>
</html>
